[project]
name = "yewo"
version = "0.1.0"
description = "AI-driven mobile (Android and iOS) end-to-end testing agent"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["testing", "e2e", "mobile", "android", "ios", "appium", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "appium-python-client>=5.0.0",
    # The excluded releases are the compromised PyPI uploads from the
    # March and October 2026 supply chain attacks, not bad builds.
    "litellm>=1.0.0,!=1.82.7,!=1.82.8,!=1.107.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pillow>=10.1.0",
    "imagehash>=4.3.1",
    "imageio-ffmpeg>=0.6.0",
]

[project.urls]
Homepage = "https://tryyewo.dev"
Repository = "https://github.com/yewohq/yewo"
Issues = "https://github.com/yewohq/yewo/issues"

[project.optional-dependencies]
# Pulls torch (127MB on macOS arm64, 555MB on linux x86_64), so it is kept
# out of the base install and fetched on demand. See yewo.utils.vision_deps.
vision = [
    "ultralytics>=8.0.0",
    "huggingface-hub>=0.16.0",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
]
# Retains the legacy engine only for explicit comparison tools.
perception-eval = [
    "easyocr>=1.6.0",
]
# The decision model is reached through its own SDK. See yewo.utils.jev_deps.
jev = [
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
yewo = "yewo.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yewo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/yewo",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "C90", "BLE", "W", "TID"]
# The formatter owns code width. The long lines that remain are prompt text and
# model-facing field descriptions, and nothing may rewrap them.
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# These modules exist only on POSIX hosts. Only yewo.host may import one, and
# only inside a branch that another host does not reach. See src/yewo/host.
"fcntl".msg = "Import POSIX-only modules inside src/yewo/host only."
"termios".msg = "Import POSIX-only modules inside src/yewo/host only."
"pty".msg = "Import POSIX-only modules inside src/yewo/host only."
"grp".msg = "Import POSIX-only modules inside src/yewo/host only."
"pwd".msg = "Import POSIX-only modules inside src/yewo/host only."

[tool.ruff.lint.per-file-ignores]
"src/yewo/host/*.py" = ["TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 21  # The project requirement is strictly less than 22.

[tool.pyright]
include = ["src/yewo", "tests"]

extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test tree mirrors src/yewo, so a test file no longer sits beside
# fakes.py and pytest no longer puts tests/ on the path by itself.
pythonpath = ["tests"]

