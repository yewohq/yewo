# yaml-language-server: $schema=https://raw.githubusercontent.com/Becca-Saka/yewo/master/yewo-schema.json
device:
  name: Pixel_8
  platform: android
  headless: false
model: openrouter/deepseek/deepseek-v4.1-flash
grounding: marks
workflows:
  fossify_calendar:
    app: ../apps/android/org.fossify.calendar_23.apk
    env:
      title: Dentist appointment
      location: 12 High Street
      notes: Bring the referral letter
    journeys:
      - id: fossify_calendar_event_01
        name: Create a calendar event
        journey: |
          A user opens the app and lands on the month view for the current month, with today's date
          marked. They tap the add button in the bottom right corner, which opens a small menu
          offering Task and Event. They choose Event. On the New Event screen they type {{title}} in
          the Title field, type {{location}} in the Location field, and type {{notes}} in the
          Description field. They then tap the tick in the top right to save the event. The app
          returns to the month view, where {{title}} now appears on today's date.
  fossify_notes:
    app: ../apps/android/org.fossify.notes_13.apk
    env:
      body: Collect the parcel from the depot before Friday
    journeys:
      - id: fossify_notes_write_01
        name: Write and keep a note
        journey: |
          A user opens the app and lands on an empty note with the placeholder Insert text here. They
          type {{body}} into the note. They tap the back arrow or leave the editor so the note is
          kept. They reopen the app, and the note still shows {{body}}.
  fossify_gallery:
    app: ../apps/android/org.fossify.gallery_29.apk
    journeys:
      - id: fossify_gallery_permission_01
        name: Grant media access and open the gallery
        journey: |
          A user opens the app and Android asks whether to allow Gallery to access photos and videos
          on this device, offering Allow limited access, Allow all, and Don't allow. They choose Allow
          all. The app then shows its own screen rather than the permission question.
  tasks:
    app: ../apps/android/org.tasks_151202.apk
    env:
      title: Renew passport
      notes: Form and two photographs
    journeys:
      - id: tasks_create_01
        name: Create a task with a due date
        journey: |
          A user opens the app for the first time and lands on a setup screen offering Add account,
          Continue without sync, and Import Tasks.org backup. They tap Continue without sync. They
          land on the My Tasks list, which says there are no tasks here. They tap the Create new task
          button in the bottom right corner. On the task editor they type {{title}} in the Task name
          field, type {{notes}} in the Description field, then tap Save. They return to the My Tasks
          list, where {{title}} now appears.
  markor:
    app: ../apps/android/net.gsantner.markor_163.apk
    env:
      filename: shopping
      body: Oats, coffee, olive oil
    journeys:
      - id: markor_permission_01
        name: Grant storage access and write a note
        journey: |
          A user opens the app for the first time and is shown a short introduction about the notebook
          folder, which they step through to the end. The app then says storage permission is required
          to read and write files, offering EXIT and OK. They tap OK. Android opens its Settings app
          on an All files access page for Markor. They turn the permission on, then return to Markor.
          Back in the file browser they create a new file named {{filename}}, type {{body}} into it,
          and save it. The file browser then lists {{filename}}.
  wikipedia:
    app: ../apps/android/org.wikipedia_50610.apk
    env:
      term: Ada Lovelace
    journeys:
      - id: wikipedia_search_save_01
        name: Search for an article and save it
        journey: |
          A user opens the app and steps through the short introduction about Wikipedia until it ends.
          They land on the feed, which has Community and For you tabs and a featured article for
          today. They tap Search and type {{term}}. They open the {{term}} article from the results.
          They save the article using the save control on the article screen. They go to the Saved
          section, which now lists {{term}}.
  organic_maps:
    app: ../apps/android/app.organicmaps_26092932.apk
    env:
      place: San Francisco
    journeys:
      - id: organic_maps_search_01
        name: Download a map and find a place
        journey: |
          A user opens the app and Android asks whether to allow Organic Maps to access the device's
          location, offering Precise and Approximate along with While using the app, Only this time,
          and Don't allow. They choose While using the app. The app then offers to download the world
          overview map, saying it uses 70 MB of storage, and asks whether to download {{place}}. They
          tap DOWNLOAD and wait for it to finish. They then search for {{place}} and open it from the
          results, and the map shows a place card for {{place}}.
  antennapod:
    app: ../apps/android/de.danoeh.antennapod_3120395.apk
    env:
      show: 99% Invisible
    journeys:
      - id: antennapod_subscribe_01
        name: Find a podcast and subscribe
        journey: |
          A user opens the app and lands on Home, which says they are not subscribed to any podcasts
          yet and offers Queue, Inbox, Subscriptions and More. They tap Search and look for {{show}}.
          They open {{show}} from the results and subscribe to it. They go to Subscriptions, which now
          lists {{show}}.
  mihon:
    app: ../apps/android/mihon-0.21.2-foss.apk
    journeys:
      - id: mihon_onboarding_01
        name: Complete first-run setup and reach the library
        journey: |
          A user opens the app for the first time and is welcomed with setup options, starting with a
          theme choice offering Light, Dark and System along with named themes such as Default,
          Dynamic and Catppuccin. They pick Dark, then tap Next and continue through the remaining
          setup steps until the setup ends. They land on the app's main screen with its own navigation
          rather than the setup flow.
  ankidroid:
    app: ../apps/android/com.ichi2.anki_22502300.apk
    env:
      deck: Spanish verbs
      front: to read
      back: leer
    journeys:
      - id: ankidroid_deck_01
        name: Create a deck and add a card
        journey: |
          A user opens the app for the first time and sees an introduction about Anki's card
          scheduler, offering Get started and Sync from AnkiWeb. They tap Get started and step through
          anything that follows until they reach the deck list. They create a new deck named {{deck}}.
          They add a card to it with {{front}} on the front and {{back}} on the back, and save it. The
          deck list then shows {{deck}} with one card due.
  bitwarden:
    app: ../apps/android/com.x8bit.bitwarden-2026.10.0.apk
    journeys:
      - id: bitwarden_onboarding_01
        name: Read the introduction and reach the sign-in choice
        journey: |
          A user opens the app for the first time and is shown an introduction carousel of four cards,
          the first headed Security, prioritized, with Create account and Log in offered beneath it.
          They move through the carousel to the last card. They tap Log in. The app shows a sign-in
          screen asking for an email address. They do not have an account, so they go back without
          signing in, and the introduction or the sign-in choice is on screen again.
        security_rules:
          - A master password or vault item must never be displayed in plain text.
  vlc:
    app: ../apps/android/org.videolan.vlc_13070106_arm64.apk
    env:
      video: bbb_360
    journeys:
      - id: vlc_play_video_01
        name: Complete onboarding and play a video
        journey: |
          A user opens the app and works through its onboarding wizard, which starts on a screen
          titled Welcome to VLC! and offers SKIP and NEXT at the bottom of every step. Along the way
          the wizard asks for two separate permissions, and the user grants both. The first opens the
          Android Settings app on a page titled All files access, where a row reading Allow access to
          manage all files has a switch that must be turned on before going back to VLC. The second is
          an ordinary Android dialog asking Allow VLC to send you notifications? The wizard ends on a
          screen whose button reads DONE. The app then opens its library, which has a VIDEOS tab and a
          bottom navigation bar offering Video, Audio, Browse, Playlists and More. The user plays
          {{video}} from the library, dismissing any first-run tips or system notices that appear,
          until the player shows {{video}} as its title alongside an elapsed time and a total
          duration.
  trainer_app:
    app: ../apps/android/trainer-app-1645-buggy.apk
    model: anthropic/claude-sonnet-5
    policy:
      waive:
        android.debuggable: DroidFixBench ships debug builds, so every APK in that corpus is debuggable.
        android.allow_backup: Debug build from a research corpus holding no production user data.
    journey: |
      A user creates and manages reusable gym training schedules. They can add
      exercises, record the workout and machine settings needed for each
      exercise, save the schedule, and return to it later to repeat or update
      the workout.
    coverage:
      - category: functional
        types: [happy_path, negative, boundary, exploratory]
        priority: P0
      - category: input
        types: [empty]
        priority: P0
