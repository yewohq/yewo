name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.declared.outputs.version }}
      release: ${{ steps.declared.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The declared version has no tag yet
        id: declared
        run: |
          version=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged, so this push releases nothing"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag, so this push releases it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          repository: danyuchn/asd-ste100-skill
          ref: 8da6b6340aa22faf46fd07db8efbdea010cd38d9
          path: .tools/asd-ste100
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Enforce the 550-line file limit
        run: uv run python tools/quality_gate.py
      - name: Enforce Ruff correctness rules
        run: uv run ruff check --ignore C90 src tests tools
      - name: Enforce cyclomatic complexity
        run: uv run ruff check --select C90 src tests tools
      - name: Enforce static types
        run: uv run pyright
      - name: Run tests
        run: uv run pytest
      - name: Enforce controlled language
        run: uv run python tools/ste_gate.py
        env:
          YEWO_STE_LINT: .tools/asd-ste100/scripts/ste-lint.py
      - name: Verify the built package
        run: |
          uv build --wheel --out-dir dist
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv venv --python 3.12 .package-venv
          uv pip install --python .package-venv/bin/python "${wheels[0]}"
          .package-venv/bin/python -c "import yewo"
          .package-venv/bin/yewo --help

  publish:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always

  tag:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The tag records what reached PyPI. It is written after a successful
      # publish, so a failed release leaves no tag and the same push can retry.
      - name: Tag the published version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
