name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          repository: danyuchn/asd-ste100-skill
          ref: 8da6b6340aa22faf46fd07db8efbdea010cd38d9
          path: .tools/asd-ste100
      - name: Install development dependencies
        run: uv sync --group dev
      - name: The tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$tagged" = "$declared" || {
            echo "tag $tagged does not match pyproject $declared"
            exit 1
          }
      - name: Enforce the 550-line file limit
        run: uv run python tools/quality_gate.py
      - name: Enforce Ruff correctness rules
        run: uv run ruff check --ignore C90 src tests tools
      - name: Enforce cyclomatic complexity
        run: uv run ruff check --select C90 src tests tools
      - name: Enforce static types
        run: uv run pyright
      - name: Run tests
        run: uv run pytest
      - name: Enforce controlled language
        run: uv run python tools/ste_gate.py
        env:
          YEWO_STE_LINT: .tools/asd-ste100/scripts/ste-lint.py
      - name: Verify the built package
        run: |
          uv build --wheel --out-dir dist
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv venv --python 3.12 .package-venv
          uv pip install --python .package-venv/bin/python "${wheels[0]}"
          .package-venv/bin/python -c "import yewo"
          .package-venv/bin/yewo --help

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always
