name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          repository: danyuchn/asd-ste100-skill
          ref: 8da6b6340aa22faf46fd07db8efbdea010cd38d9
          path: .tools/asd-ste100
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Enforce Ruff correctness rules
        run: uv run ruff check --ignore C90 src tests tools
      - name: Enforce cyclomatic complexity
        run: uv run ruff check --select C90 src tests tools
      - name: Enforce static types
        run: uv run pyright
      - name: Run tests
        run: uv run pytest
      - name: Enforce the 550-line file limit
        run: uv run python tools/quality_gate.py
      - name: Enforce controlled language
        run: uv run python tools/ste_gate.py
        env:
          YEWO_STE_LINT: .tools/asd-ste100/scripts/ste-lint.py
      - name: Verify the package in a clean environment
        run: uv run python tools/package_gate.py
